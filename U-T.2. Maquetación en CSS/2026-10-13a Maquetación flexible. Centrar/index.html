<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        :root{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20;
        }

        *, *::before, *::after{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100dvh;
            display: flex;
            /*Valor de dirección principal por defecto*/
            flex-direction: row;
            /*Distribucion en la dirección principal*/
            justify-content: center;
            /*Distribucion en la dirección secundaria*/
            align-items: center;
        }

        .caja{
            background-color: blue;
            width: 100px;
            aspect-ratio: 1;
        }
    </style>
</head>
<body>
    <div class="caja"></div>
</body>
</html>
